<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | Vardaan Foods</title>
  <meta name="description" content="Create a new Vardaan Foods account." />
  <link rel="icon" type="image/png" href="/assets/logo.webp" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .auth-container {
      min-height: calc(100vh - 120px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: var(--vf-bg);
    }
    .auth-card {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 500px;
      text-align: center;
      border: 1px solid var(--vf-line-dark);
    }
    .auth-title {
      font-family: var(--vf-font-serif);
      font-size: 2rem;
      margin-bottom: 8px;
      color: var(--vf-ink);
    }
    .auth-subtitle {
      color: var(--vf-ink-muted);
      margin-bottom: 32px;
      font-size: 0.95rem;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }
    .auth-form .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .auth-form label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--vf-ink);
    }
    .auth-form input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--vf-line-dark);
      border-radius: 8px;
      font-family: var(--vf-font-sans);
      font-size: 1rem;
      transition: all 0.3s ease;
      background: #fafafa;
    }
    .auth-form input:focus {
      outline: none;
      border-color: var(--vf-gold);
      box-shadow: 0 0 0 3px rgba(234, 187, 98, 0.2);
      background: #fff;
    }
    .auth-submit-btn {
      margin-top: 16px;
      padding: 16px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .auth-submit-btn:hover {
      background: var(--vf-gold);
    }
    .auth-links {
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--vf-ink-muted);
    }
    .auth-links a {
      color: var(--vf-gold);
      font-weight: 600;
      text-decoration: none;
    }
    .auth-links a:hover {
      text-decoration: underline;
    }
    #auth-error {
      color: #dc2626;
      font-size: 0.9rem;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Header / Navigation -->
  <header class="header" style="background: var(--vf-bg); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(0,0,0,0.05);">
    <div class="container header-inner">
      <a href="/" class="nav-logo">
        <img src="/assets/logo.webp" alt="Vardaan Foods Logo" style="height: 64px; width: auto;" />
      </a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/#shop">Shop Oils</a></li>
        <li><a href="/about.html">About Us</a></li>
        <li><a href="/login.html" style="color: var(--vf-gold); font-weight: 600;">Login</a></li>
      </ul>
      <div class="header-actions">
        <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Toggle Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <button class="cart-icon-btn" aria-label="Open Cart Basket" onclick="window.location.href='/'">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join the Vardaan family for faster checkout.</p>

      <div id="auth-error">Error creating account. Please try again.</div>

      <form id="register-form" class="auth-form">
        <div class="row">
          <div>
            <label for="reg-first-name">First Name</label>
            <input type="text" id="reg-first-name" placeholder="Rahul" required />
          </div>
          <div>
            <label for="reg-last-name">Last Name</label>
            <input type="text" id="reg-last-name" placeholder="Sharma" required />
          </div>
        </div>
        <div>
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" placeholder="you@example.com" required />
        </div>
        <div>
          <label for="reg-password">Password (Min 6 characters)</label>
          <input type="password" id="reg-password" placeholder="••••••••" required minlength="6" />
        </div>
        <button type="submit" class="auth-submit-btn">Create Account</button>
      </form>

      <div class="auth-links">
        Already have an account? <a href="/login.html">Sign in here</a>.
      </div>
    </div>
  </main>

  <script type="module" src="/src/auth.js"></script>
</body>
</html>
