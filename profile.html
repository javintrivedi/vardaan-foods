<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile | Vardaan Foods</title>
  <meta name="description" content="Manage your Vardaan Foods account, addresses, and orders." />
  <link rel="icon" type="image/png" href="/assets/logo.webp" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .profile-container {
      padding: 60px 20px;
      background: var(--vf-bg);
      min-height: calc(100vh - 120px);
    }
    .profile-grid {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 32px;
    }
    .profile-sidebar {
      background: #fff;
      border: 1px solid var(--vf-line-dark);
      border-radius: 12px;
      padding: 24px;
      height: fit-content;
    }
    .profile-avatar {
      width: 80px;
      height: 80px;
      background: var(--vf-gold);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-family: var(--vf-font-serif);
      margin-bottom: 16px;
    }
    .profile-name {
      font-family: var(--vf-font-serif);
      font-size: 1.5rem;
      color: var(--vf-ink);
      margin-bottom: 4px;
    }
    .profile-email {
      color: var(--vf-ink-muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .profile-nav {
      list-style: none;
      padding: 0;
      margin: 0;
      border-top: 1px solid var(--vf-line-dark);
      padding-top: 24px;
    }
    .profile-nav li {
      margin-bottom: 12px;
    }
    .profile-nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--vf-ink);
      font-weight: 500;
      padding: 10px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .profile-nav a:hover, .profile-nav a.active {
      background: rgba(234, 187, 98, 0.1);
      color: var(--vf-gold);
    }
    
    .profile-content {
      background: #fff;
      border: 1px solid var(--vf-line-dark);
      border-radius: 12px;
      padding: 32px;
    }
    .profile-section-title {
      font-family: var(--vf-font-serif);
      font-size: 1.8rem;
      color: var(--vf-ink);
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--vf-line-dark);
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--vf-ink);
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--vf-line-dark);
      border-radius: 8px;
      font-family: var(--vf-font-sans);
      background: #fafafa;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--vf-gold);
      background: #fff;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .btn-save {
      background: #222;
      color: #fff;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: 0.3s;
    }
    .btn-save:hover {
      background: var(--vf-gold);
    }
    
    .logout-btn {
      color: #dc2626 !important;
    }
    .logout-btn:hover {
      background: #fef2f2 !important;
    }

    /* Loading state */
    .profile-loading {
      text-align: center;
      padding: 40px;
      color: var(--vf-ink-muted);
    }

    @media (max-width: 768px) {
      .profile-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Header / Navigation -->
  <header class="header" style="background: var(--vf-bg); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(0,0,0,0.05);">
    <div class="container header-inner">
      <a href="/" class="nav-logo">
        <img src="/assets/logo.webp" alt="Vardaan Foods Logo" style="height: 64px; width: auto;" />
      </a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/#shop">Shop Oils</a></li>
        <li><a href="/about.html">About Us</a></li>
        <li><a href="/profile.html" style="color: var(--vf-gold); font-weight: 600;">My Account</a></li>
      </ul>
      <div class="header-actions">
        <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Toggle Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <button class="cart-icon-btn" aria-label="Open Cart Basket" onclick="window.location.href='/'">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="profile-container container">
    <div class="profile-grid">
      <!-- Sidebar -->
      <aside class="profile-sidebar">
        <div class="profile-avatar" id="avatar-initials">V</div>
        <h2 class="profile-name" id="sidebar-name">Loading...</h2>
        <p class="profile-email" id="sidebar-email">...</p>
        
        <ul class="profile-nav">
          <li>
            <a href="#" class="active" id="nav-address">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
              My Address
            </a>
          </li>
          <li>
            <a href="#" id="nav-orders">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
              Order History
            </a>
          </li>
          <li id="admin-nav-item" style="display: none;">
            <a href="/admin.html" id="nav-admin">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
              Admin Panel
            </a>
          </li>
          <li>
            <a href="#" class="logout-btn" id="logout-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
              Log Out
            </a>
          </li>
        </ul>
      </aside>

      <!-- Content Area -->
      <section class="profile-content">
        <div id="section-address">
          <h1 class="profile-section-title">Default Delivery Address</h1>
          <form id="profile-form">
            <div class="form-row">
              <div class="form-group">
                <label>First Name</label>
                <input type="text" id="prof-first" required />
              </div>
              <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="prof-last" required />
              </div>
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" id="prof-phone" />
            </div>
            <div class="form-group">
              <label>Street Address</label>
              <input type="text" id="prof-street" />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>City</label>
                <input type="text" id="prof-city" />
              </div>
              <div class="form-group">
                <label>State</label>
                <input type="text" id="prof-state" />
              </div>
            </div>
            <div class="form-group">
              <label>PIN Code</label>
              <input type="text" id="prof-pin" />
            </div>
            <button type="submit" class="btn-save" id="save-profile-btn">Save Changes</button>
            <span id="save-msg" style="margin-left:12px; color: #15803d; display:none;">Saved!</span>
          </form>
        </div>

        <div id="section-orders" style="display: none;">
          <h1 class="profile-section-title">Order History</h1>
          <div id="orders-list">
            <p style="color: var(--vf-ink-muted);">No past orders found.</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="/src/auth.js"></script>
</body>
</html>
